[project]
authors = [{name = "Finlay Clark", email = "finlay.clark@newcastle.ac.uk"}]
name = "contorsion"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = ["mace-torch<0.3.13"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.scripts]
contorsion = "contorsion.drive_torsions:cli"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
contorsion = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
openff-toolkit = ">=0.17.1,<0.18"
typer = ">=0.20.0,<0.21"
rich = ">=14.2.0,<15"
numpy = ">=2.3.4,<3"
matplotlib = ">=3.10.7,<4"
qcelemental = ">=0.29.0,<0.30"
qcengine = ">=0.33.0,<0.34"
rdkit = ">=2025.3.6,<2026"
openmmforcefields = ">=0.14.2,<0.15"
torsiondrive = ">=1.2.0,<2"
